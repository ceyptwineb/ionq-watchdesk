<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IONQ Watchdesk</title>
  <style>
    :root {
      --bg: #f5f6f3;
      --panel: #ffffff;
      --panel-2: #fbfcfa;
      --line: #d9ded6;
      --text: #17201b;
      --muted: #66736b;
      --accent: #0c756d;
      --accent-soft: #dff2ee;
      --warn: #9b5a00;
      --danger: #a33b3b;
      --ok: #147246;
      --shadow: 0 10px 24px rgba(20, 34, 28, .08);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.55;
      overflow: hidden;
    }

    button, input, textarea { font: inherit; }
    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 6px;
      padding: 8px 10px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 700;
    }
    button.ghost { background: var(--panel-2); }
    button:disabled { opacity: .55; cursor: not-allowed; }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .app {
      height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(330px, 390px);
      grid-template-rows: auto minmax(0, 1fr);
      grid-template-areas:
        "header header"
        "feed detail";
    }

    .side {
      grid-area: header;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .96);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
      box-shadow: 0 3px 12px rgba(20, 34, 28, .04);
      z-index: 2;
    }

    .brand h1 {
      margin: 0 0 4px;
      font-size: 20px;
      letter-spacing: 0;
    }
    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .status-box {
      margin-left: auto;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 5px 12px;
      font-size: 12px;
      color: var(--muted);
    }
    .status-box > div { white-space: nowrap; }
    .status-box #sources {
      color: var(--ok);
      background: #e8f5ed;
      border-radius: 999px;
      padding: 3px 9px;
      font-weight: 700;
    }
    .status-technical { display: none; }

    .tabs {
      display: grid;
      gap: 7px;
    }
    .tab {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      text-align: left;
      min-height: 38px;
    }
    .tab.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      font-weight: 700;
      color: #064d47;
    }
    .count {
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }

    .side-actions { display: flex; flex-wrap: wrap; gap: 7px; }
    .side-actions button { white-space: nowrap; }

    .main {
      grid-area: feed;
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      border-right: 1px solid var(--line);
    }

    .toolbar {
      padding: 10px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 9px;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .toolbar-row {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) auto;
      gap: 8px;
      align-items: center;
    }
    .utility-row {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
    }
    .weekly-action {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
      font-weight: 700;
    }
    .filter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 14px;
    }
    .filter-group { display: flex; align-items: center; gap: 7px; }
    .filter-label { color: var(--muted); font-size: 11px; font-weight: 700; }
    .search {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px 10px;
      min-width: 0;
      background: #fff;
    }

    .feed {
      overflow: auto;
      padding: 10px;
      display: grid;
      align-content: start;
      gap: 8px;
    }

    .priority-box {
      border: 1px solid #ead49f;
      border-left: 4px solid #c48b16;
      background: #fffcf5;
      border-radius: 10px;
      padding: 11px 11px 11px 12px;
      display: grid;
      gap: 8px;
    }
    .priority-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      color: #6f4a00;
      font-weight: 700;
    }
    .priority-list {
      display: grid;
      gap: 7px;
    }

    .item {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 13px;
      display: grid;
      gap: 8px;
    }
    .item.active {
      border-color: var(--accent);
      box-shadow: var(--shadow);
    }
    .item.priority {
      border-color: transparent;
      background: rgba(255, 255, 255, .82);
    }
    .item-title {
      font-weight: 700;
      font-size: 15px;
      line-height: 1.42;
      overflow-wrap: anywhere;
    }
    .item-title-original {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }
    .badge {
      border: 1px solid var(--line);
      background: #f8f9f6;
      border-radius: 999px;
      padding: 1px 7px;
    }
    .item-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .posted {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      user-select: none;
    }

    .detail {
      grid-area: detail;
      min-width: 0;
      min-height: 0;
      background: var(--panel-2);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }
    .detail-head {
      padding: 14px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      display: grid;
      gap: 8px;
    }
    .detail-head h2 {
      margin: 0;
      font-size: 17px;
      line-height: 1.42;
      overflow-wrap: anywhere;
    }
    .detail-body {
      overflow: auto;
      padding: 14px;
      display: grid;
      align-content: start;
      gap: 12px;
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 12px;
      display: grid;
      gap: 8px;
    }
    .card h3 {
      margin: 0;
      font-size: 14px;
    }
    .url-box {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #f8f9f6;
      padding: 9px;
      color: var(--muted);
      overflow-wrap: anywhere;
      font-size: 12px;
    }
    textarea {
      width: 100%;
      min-height: 145px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      resize: vertical;
      line-height: 1.6;
      background: #fff;
      color: var(--text);
    }
    .stack { display: grid; gap: 8px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .muted { color: var(--muted); font-size: 12px; }
    .ok { color: var(--ok); font-weight: 700; }
    .warn { color: var(--warn); font-weight: 700; }
    .empty {
      padding: 24px;
      color: var(--muted);
      text-align: center;
    }

    .item.done { opacity: .5; }
    .item.done .item-title { text-decoration: line-through; }
    .age-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
    .age-tabs button {
      flex: 0 0 auto;
      padding: 4px 10px;
      font-size: 12px;
      white-space: nowrap;
    }

    @media (max-width: 1100px) {
      body { overflow: auto; }
      .app {
        height: auto;
        min-height: 100vh;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto auto auto;
        grid-template-areas: "header" "feed" "detail";
      }
      .side, .main, .detail {
        height: auto;
        min-height: auto;
        border-right: 0;
      }
      .side { border-bottom: 1px solid var(--line); flex-wrap: wrap; }
      .status-box { order: 3; width: 100%; margin-left: 0; justify-content: flex-start; }
      .main { border-bottom: 1px solid var(--line); }
      .toolbar-row { grid-template-columns: minmax(0, 1fr) auto; }
      .feed { max-height: 70vh; }
    }

    @media (max-width: 640px) {
      .side { padding: 10px; }
      .brand { width: 100%; }
      .brand p { white-space: normal; }
      .side-actions { width: 100%; }
      .side-actions button { flex: 1 1 auto; }
      .filter-row { align-items: flex-start; }
      .filter-group { flex-wrap: wrap; }
      .item-actions { align-items: flex-end; }
      .utility-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      }
      .utility-row button {
        width: 100%;
        min-height: 42px;
      }
      .utility-row .weekly-action { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="side">
      <div class="brand">
        <h1>IONQ Watchdesk</h1>
        <p>最新ニュースの収集と投稿ネタのすみわけ管理</p>
      </div>
      <div class="status-box">
        <div id="version" class="status-technical">version: design-refresh-20260717</div>
        <div id="updated">更新 --</div>
        <div id="endpoint" class="status-technical">source: --</div>
        <div id="sources">収集 --</div>
        <div id="summary">ニュース --</div>
      </div>
      <div class="side-actions">
        <button id="showAll" class="primary">最新ニュースを見る</button>
        <button id="showPosted">投稿済みだけ見る</button>
        <button id="hideUnreadable">GPTで読めない媒体を隠す</button>
      </div>
    </aside>

    <section class="main">
      <div class="toolbar">
        <div class="toolbar-row">
          <input id="search" class="search" type="search" placeholder="ニュース、企業、材料を検索">
          <button id="reload" class="primary">更新</button>
        </div>
        <div class="filter-row">
          <div class="filter-group age-tabs">
            <span class="filter-label">期間</span>
            <button id="age24" type="button">24h</button>
            <button id="age48" class="primary" type="button">48h</button>
            <button id="age72" type="button">72h</button>
            <button id="age168" type="button">7日</button>
          </div>
          <div class="filter-group age-tabs">
            <span class="filter-label">投稿優先度</span>
            <button id="tierAll" class="primary" type="button">全部</button>
            <button id="tier0" type="button">🚨速報</button>
            <button id="tier1" type="button">✍投稿候補</button>
            <button id="tier2" type="button">📚保管</button>
          </div>
        </div>
        <div class="utility-row" aria-label="まとめと投稿済み操作">
          <button id="weeklyDigest" class="weekly-action" type="button">🚨速報の週間まとめ</button>
          <button id="markAllPosted" class="secondary-action" type="button">表示中を投稿済み</button>
          <button id="clearPosted" class="ghost secondary-action" type="button">投稿済みクリア</button>
        </div>
      </div>
      <div id="feed" class="feed"></div>
    </section>

    <section class="detail">
      <div id="detailHead" class="detail-head">
        <h2>ニュースを選択</h2>
        <div class="muted">記事URLをGPTsへ渡して、深掘りレポートを作る運用に戻します。</div>
      </div>
      <div class="detail-body">
        <div class="card">
          <h3>GPTs用コピー</h3>
          <textarea id="gptsText" readonly>左のニュースを選択してください。</textarea>
          <div class="row">
            <button id="copyGpts" class="primary">GPTs用テキストをコピー</button>
            <button id="openGpts">GPTsを開く</button>
            <button id="copyUrl">URLだけコピー</button>
            <button id="openUrl">元記事を開く</button>
            <button id="blockSource" class="ghost">この媒体は読めなかった</button>
          </div>
          <div id="copyStatus" class="muted">待機中</div>
        </div>

        <div class="card">
          <h3>運用メモ</h3>
          <div class="muted">このサイトは集計が主役。レポート作成はGPTsに任せます。</div>
          <div class="muted">古い記事は自動で落とし、48時間以内の情報だけを表示します。</div>
          <div class="muted">投稿済みチェックは「元ネタに対して投稿したか」を管理するために使います。</div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const APP_VERSION = "editorial-priority-20260727";
    const PUBLIC_ORIGIN = "https://ionqnews.netlify.app";
    const GPTS_URL = "https://chatgpt.com/g/g-6a41a5264e6081918db223a3b8a4d808-liang-zi-rehoto";
    const WEEKLY_GPTS_URL = "https://chatgpt.com/g/g-6a629ec2cb7c81919c4f72700a4839c6-liang-zi-zhou-jian-rehoto";
    const DEFAULT_MAX_AGE_HOURS = 48;
    const isLocalPreview = location.protocol === "file:" || location.hostname === "127.0.0.1" || location.hostname === "localhost";
    const API = isLocalPreview ? PUBLIC_ORIGIN : "";
    const latestEndpoint = API + "/.netlify/functions/latest-ionq";
    const postedEndpoint = API + "/.netlify/functions/posted";

    const state = {
      rawItems: [],
      items: [],
      posted: new Set(loadLocalPosted()),
      selectedId: "",
      view: "all",
      query: "",
      maxAgeHours: DEFAULT_MAX_AGE_HOURS,
      tier: "all",
      candidateIds: new Set(),
      blockedSources: new Set(),
      allowedSources: new Set(),
      sourceStats: {},
      hideUnreadable: localStorage.getItem("ionq-hide-unreadable") === "1"
    };

    const el = {
      updated: document.getElementById("updated"),
      sources: document.getElementById("sources"),
      endpoint: document.getElementById("endpoint"),
      summary: document.getElementById("summary"),
      showAll: document.getElementById("showAll"),
      showPosted: document.getElementById("showPosted"),
      hideUnreadable: document.getElementById("hideUnreadable"),
      blockSource: document.getElementById("blockSource"),
      feed: document.getElementById("feed"),
      search: document.getElementById("search"),
      reload: document.getElementById("reload"),
      weeklyDigest: document.getElementById("weeklyDigest"),
      markAllPosted: document.getElementById("markAllPosted"),
      clearPosted: document.getElementById("clearPosted"),
      detailHead: document.getElementById("detailHead"),
      gptsText: document.getElementById("gptsText"),
      copyGpts: document.getElementById("copyGpts"),
      openGpts: document.getElementById("openGpts"),
      copyUrl: document.getElementById("copyUrl"),
      openUrl: document.getElementById("openUrl"),
      copyStatus: document.getElementById("copyStatus"),
      age24: document.getElementById("age24"),
      age48: document.getElementById("age48"),
      age72: document.getElementById("age72"),
      age168: document.getElementById("age168"),
      tierAll: document.getElementById("tierAll"),
      tier0: document.getElementById("tier0"),
      tier1: document.getElementById("tier1"),
      tier2: document.getElementById("tier2")
    };

    // 初回同期でも参照するため、init()より先に初期化する。
    // 以前は下部で宣言していたため、起動直後のloadPostedFromServer()が
    // Temporal Dead Zoneに入り、投稿済み状態の読込みが約60秒遅れていた。
    const pendingOps = new Map(); // id -> 望みの状態(true/false)

    init();

    function init() {
      document.getElementById("version").textContent = "version: " + APP_VERSION;
      el.endpoint.textContent = "source: " + latestEndpoint;
      bindEvents();
      loadPostedFromServer();
      refresh();
      setInterval(refresh, 60000);
      // 投稿済み状態も定期同期(別端末での変更・クリアを取り込む)
      setInterval(loadPostedFromServer, 60000);
    }

    function bindEvents() {
      el.reload.addEventListener("click", refresh);
      el.search.addEventListener("input", function () {
        state.query = el.search.value.trim().toLowerCase();
        renderFeed();
      });
      el.copyGpts.addEventListener("click", copyGptsText);
      el.openGpts.addEventListener("click", copyAndOpenGpts);
      el.copyUrl.addEventListener("click", copySelectedUrl);
      el.openUrl.addEventListener("click", openSelectedUrl);
      el.weeklyDigest.addEventListener("click", createWeeklyDigest);
      el.markAllPosted.addEventListener("click", markAllPosted);
      el.clearPosted.addEventListener("click", clearPosted);
      el.hideUnreadable.addEventListener("click", function () {
        state.hideUnreadable = !state.hideUnreadable;
        localStorage.setItem("ionq-hide-unreadable", state.hideUnreadable ? "1" : "0");
        updateViewButtons();
        renderFeed();
      });
      el.blockSource.addEventListener("click", toggleBlockedSource);
      [[el.age24, 24], [el.age48, 48], [el.age72, 72], [el.age168, 168]].forEach(function (pair) {
        pair[0].addEventListener("click", function () { setMaxAge(pair[1]); });
      });
      [[el.tierAll, "all"], [el.tier0, 0], [el.tier1, 1], [el.tier2, 2]].forEach(function (pair) {
        pair[0].addEventListener("click", function () { setTier(pair[1]); });
      });
      el.showAll.addEventListener("click", function () {
        state.view = "all";
        updateViewButtons();
        renderFeed();
      });
      el.showPosted.addEventListener("click", function () {
        state.view = "posted";
        updateViewButtons();
        renderFeed();
      });
    }

    async function refresh() {
      el.updated.textContent = "更新中";
      try {
        const data = await fetchJson(latestEndpoint, 12000);
        state.rawItems = extractItems(data);
        applyAgeFilter();
        const cachedAt = data.cachedAt || data.updatedAt || new Date().toISOString();
        state.sourceStats = data.sourceStats || {};
        renderSourceHealth(state.sourceStats, cachedAt);
        const cacheNote = data.cacheStatus === "hit" ? "" :
          data.cacheStatus === "stale_fallback" ? " (キャッシュ古/軽量応答)" :
          data.cacheStatus === "miss_fallback" ? " (初回/軽量応答)" : "";
        el.updated.textContent = "更新 " + formatTime(cachedAt) + cacheNote;
        updateViewButtons();
        renderFeed();
        if (!state.selectedId && state.items.length) selectItem(state.items[0].id);
      } catch (error) {
        el.updated.textContent = "更新失敗";
        el.summary.textContent = "ニュース取得失敗";
        el.feed.innerHTML = errorBox("速報取得に失敗しました", error.message, latestEndpoint);
      }
    }

    function renderSourceHealth(stats, cachedAt) {
      const entries = Object.entries(stats || {});
      const cacheAge = Date.now() - Date.parse(cachedAt || "");
      if (!entries.length) {
        el.sources.textContent = "収集 状態不明";
        el.sources.style.color = "";
        return;
      }
      const failed = entries.filter(function (pair) { return pair[1] && pair[1].error; });
      const empty = entries.filter(function (pair) { return pair[1] && !pair[1].error && pair[1].count === 0; });
      const stale = Number.isFinite(cacheAge) && cacheAge > 2 * 60 * 60 * 1000;
      const parts = ["正常 " + (entries.length - failed.length) + "/" + entries.length];
      if (failed.length) parts.push("失敗 " + failed.map(function (pair) { return pair[0]; }).join(","));
      if (empty.length) parts.push("0件 " + empty.map(function (pair) { return pair[0]; }).join(","));
      if (stale) parts.push("更新2時間超");
      el.sources.textContent = "収集 " + parts.join(" / ");
      el.sources.style.color = failed.length || stale ? "#b54434" : "";
    }

    // 新形式(data.items: バックエンドで正規化・ID付与済み)を優先。
    // 旧形式のレスポンスが来た場合のフォールバックも残す。
    function extractItems(data) {
      if (Array.isArray(data.items)) return data.items;
      const rows = [];
      addRows(rows, data.officialNews, "ir", "最新IR", "IR");
      addRows(rows, data.sec, "sec", "重要SEC", "SEC");
      addRows(rows, data.marketNews, "news", "IONQ NEWS", "NEWS");
      addRows(rows, data.macroNews, "macro", "金融・マクロ", "MNEWS");
      addRows(rows, data.quantumNews, "quantum", "量子業界", "QNEWS");
      addRows(rows, data.competitorSec, "competitor", "競合SEC", "CSEC");
      addRows(rows, data.competitorNews, "competitor", "競合NEWS", "CNEWS");
      return rows;
    }

    function setMaxAge(hours) {
      state.maxAgeHours = hours;
      [[el.age24, 24], [el.age48, 48], [el.age72, 72], [el.age168, 168]].forEach(function (pair) {
        pair[0].className = state.maxAgeHours === pair[1] ? "primary" : "";
      });
      applyAgeFilter();
      updateViewButtons();
      renderFeed();
    }

    function setTier(tier) {
      state.tier = tier;
      [[el.tierAll, "all"], [el.tier0, 0], [el.tier1, 1], [el.tier2, 2]].forEach(function (pair) {
        pair[0].className = state.tier === pair[1] ? "primary" : "";
      });
      renderFeed();
    }

    // ============================================================
    // 投稿枠を使う価値で分類する。
    // 速報    : 今日見落とすと困る、直接性・緊急性の高い材料。
    // 投稿候補: 具体的な事実と投稿角度があり、直近24時間の上位5件に入る材料。
    // 保管    : 既報・解説・重複・薄い言及など、後から参照できれば十分な材料。
    // ============================================================
    function candidateKey(item) {
      return String(item.id || item.url || item.title || "");
    }

    function postTier(item) {
      const score = newsPriorityScore(item);
      if (score >= 80) return 0;
      if (score >= 60 && state.candidateIds.has(candidateKey(item))) return 1;
      return 2;
    }

    const TIER_META = {
      0: { label: "🚨速報", border: "#c9463d", color: "#9f2f28", bg: "#fde8e5" },
      1: { label: "✍投稿候補", border: "#0c756d", color: "#0c756d", bg: "#dff2ee" },
      2: { label: "📚保管", border: "#c9cec6", color: "#707970", bg: "#f4f6f2" }
    };

    function renderTierBadge(item) {
      const m = TIER_META[postTier(item)];
      return "<span class=\"badge\" style=\"border-color:" + m.border + ";color:" + m.color + ";background:" + m.bg + ";font-weight:700;\">" + m.label + "</span>";
    }

    function applyAgeFilter() {
      rebuildSimilarityIndex();
      refreshSimilarPostedFlags();
      const seenIds = new Set();
      const valid = state.rawItems.filter(function (item) {
        if (!(item.title || item.url)) return false;
        if (isExcludedSource(item)) return false;
        if (item.id && seenIds.has(item.id)) return false;
        if (item.id) seenIds.add(item.id);
        return true;
      });
      const fresh = valid.filter(isFreshItem).sort(function (a, b) {
        return Date.parse(b.publishedAt || b.acceptedAt || 0) - Date.parse(a.publishedAt || a.acceptedAt || 0);
      });
      state.items = groupSimilarItems(fresh);
      state.candidateIds = new Set(
        state.items
          .filter(function (item) {
            const score = newsPriorityScore(item);
            return score >= 60 && score < 80 && isWithinHours(item, 24);
          })
          .sort(compareNewsPriority)
          .slice(0, 5)
          .map(candidateKey)
      );
      renderSummary(buildStats(valid, fresh));
    }

    // 同じニュースの言い換え転載を1枚のカードにまとめる。
    // 代表 = 一次情報に近く、材料性が高い媒体。残りはgroupItemsに保持する。
    function groupSimilarItems(items) {
      const parent = items.map(function (_, i) { return i; });
      function find(x) {
        while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; }
        return x;
      }
      for (let i = 0; i < items.length; i += 1) {
        if (items[i].form) continue;
        for (let j = i + 1; j < items.length; j += 1) {
          if (items[j].form) continue;
          if (find(i) === find(j)) continue;
          if (isSimilarNews(items[i], items[j])) parent[find(j)] = find(i);
        }
      }
      const groups = new Map();
      items.forEach(function (item, i) {
        const root = find(i);
        if (!groups.has(root)) groups.set(root, []);
        groups.get(root).push(item);
      });
      return Array.from(groups.values()).map(function (members) {
        members.sort(compareNewsPriority);
        const representative = members[0];
        representative.groupItems = members;
        return representative;
      }).sort(function (a, b) {
        return Date.parse(b.publishedAt || b.acceptedAt || 0) - Date.parse(a.publishedAt || a.acceptedAt || 0);
      });
    }

    function groupSources(item) {
      const list = (item.groupItems || [item]).map(function (m) { return m.source; }).filter(Boolean);
      const uniq = Array.from(new Set(list));
      return uniq.slice(0, 3).join(" / ") + (uniq.length > 3 ? " 他" : "");
    }

    function addRows(rows, list, category, label, type) {
      (list || []).forEach(function (raw) {
        const title = raw.title || [raw.ticker, raw.form, raw.description].filter(Boolean).join(" ");
        const source = raw.source || raw.companyName || raw.ticker || label;
        const publishedAt = raw.publishedAt || raw.acceptedAt || raw.filingDate || raw.reportDate || "";
        const url = raw.url || "";
        rows.push(Object.assign({}, raw, {
          id: stableId({ form: raw.form, url: url, title: title }),
          legacyId: legacyStableId({ type: type, form: raw.form, url: url, title: title }),
          category: category,
          label: label,
          type: type,
          title: title,
          titleJa: raw.titleJa || raw.translatedTitle || "",
          source: source,
          publishedAt: publishedAt,
          url: url
        }));
      });
    }

    function updateViewButtons() {
      el.showAll.className = state.view === "all" ? "primary" : "";
      el.showPosted.className = state.view === "posted" ? "primary" : "";
      el.hideUnreadable.className = state.hideUnreadable ? "primary" : "";
      const unreadableCount = state.items.filter(itemUnreadable).length;
      el.hideUnreadable.textContent = (state.hideUnreadable ? "読めない媒体を表示に戻す" : "GPTで読めない媒体を隠す") + " (" + unreadableCount + ")";
      const posted = countPosted();
      const unposted = state.items.length - posted;
      el.showAll.textContent = "最新ニュースを見る (未投稿 " + unposted + ")";
      el.showPosted.textContent = "投稿済みだけ見る (" + posted + ")";
    }

    function countPosted() {
      return state.items.filter(function (item) { return isPosted(item); }).length;
    }

    function buildStats(valid, fresh) {
      const stats = {
        total: valid.length,
        fresh: fresh.length,
        old: Math.max(0, valid.length - fresh.length),
        byCategory: {}
      };
      valid.forEach(function (item) {
        if (!stats.byCategory[item.category]) {
          stats.byCategory[item.category] = { total: 0, fresh: 0 };
        }
        stats.byCategory[item.category].total += 1;
      });
      fresh.forEach(function (item) {
        if (!stats.byCategory[item.category]) {
          stats.byCategory[item.category] = { total: 0, fresh: 0 };
        }
        stats.byCategory[item.category].fresh += 1;
      });
      return stats;
    }

    function renderSummary(stats) {
      if (!stats) {
        el.summary.textContent = "ニュース --";
        return;
      }
      const parts = [
        "取得 " + stats.total + "件",
        state.maxAgeHours + "h " + stats.fresh + "件",
        "除外 " + stats.old + "件"
      ];
      el.summary.textContent = parts.join(" / ");
    }

    function renderFeed() {
      const items = filteredItems();
      const selectionVisible = items.some(function (item) { return item.id === state.selectedId; });
      if (!selectionVisible && items.length) {
        selectItem(items[0].id);
        return;
      }
      if (!items.length && state.selectedId) {
        state.selectedId = "";
        el.detailHead.innerHTML = "<h2>表示対象の記事がありません</h2>";
        el.gptsText.value = "";
        el.copyStatus.textContent = "フィルターを変更してください";
        updateBlockSourceButton(null);
      }
      // 優先欄も検索・期間・投稿済み・読取可否・優先度フィルターに従わせる。
      // 特に「投稿済みだけ」画面へ未投稿記事が出ないようにする。
      const priorityItems = items
        .filter(function (item) { return postTier(item) === 0 && !isPosted(item); })
        .sort(compareNewsPriority)
        .slice(0, 5);

      el.feed.innerHTML = "";
      appendPriorityBox(priorityItems);

      if (!items.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.innerHTML = [
          "<div>" + state.maxAgeHours + "時間以内の表示対象ニュースはありません。</div>",
          "<div class=\"muted\">上の 24h / 48h / 72h / 7日 で期間を、投稿ネタで区分を切り替えられます。</div>"
        ].join("");
        el.feed.appendChild(empty);
        return;
      }

      const priorityIds = new Set(priorityItems.map(function (item) { return item.id; }));
      items
        .filter(function (item) { return !priorityIds.has(item.id); })
        .forEach(function (item) { appendItemCard(el.feed, item, false); });
    }

    function appendPriorityBox(priorityItems) {
      if (!priorityItems.length) return;
      const box = document.createElement("section");
      box.className = "priority-box";
      box.innerHTML = [
        "<div class=\"priority-head\"><span>投稿優先ニュース</span><span class=\"count\">" + priorityItems.length + "</span></div>",
        "<div class=\"priority-list\"></div>"
      ].join("");
      const list = box.querySelector(".priority-list");
      priorityItems.forEach(function (item) { appendItemCard(list, item, true); });
      el.feed.appendChild(box);
    }

    function appendItemCard(parent, item, priority) {
      const card = document.createElement("article");
      const done = isPosted(item);
      card.className = "item" + (priority ? " priority" : "") + (item.id === state.selectedId ? " active" : "") + (done ? " done" : "");
      card.innerHTML = [
        "<div class=\"item-title\">" + escapeHtml(displayTitle(item)) + "</div>",
        item.titleJa ? "<div class=\"item-title-original\">" + escapeHtml(item.title) + "</div>" : "",
        "<div class=\"meta\">",
        renderTierBadge(item),
        renderPriorityReasonBadges(item),
        "<span class=\"badge\">" + escapeHtml(item.label) + "</span>",
        (item.groupItems && item.groupItems.length > 1 ? "<span class=\"badge\">同ニュース×" + item.groupItems.length + "</span>" : ""),
        (itemUnreadable(item) ? "<span class=\"badge\" style=\"border-color:#d3a64a;color:#9b5a00;\">GPT読取難</span>" : ""),
        (isUntranslated(item) ? "<span class=\"badge\">翻訳待ち</span>" : ""),
        item.form ? "<span class=\"badge\">" + escapeHtml(item.form) + "</span>" : "",
        "<span>" + escapeHtml(groupSources(item)) + "</span>",
        "<span class=\"badge\">" + escapeHtml(marketSessionLabel(item.acceptedAt || item.publishedAt)) + "</span>",
        "<span>" + escapeHtml(formatTime(item.publishedAt)) + "</span>",
        "</div>",
        "<div class=\"item-actions\">",
        "<label class=\"posted\"><input type=\"checkbox\" " + (done ? "checked" : "") + ">投稿済み</label>",
        "<div class=\"row\"><button type=\"button\" data-act=\"open-gpts\" class=\"primary\">GPTs\u3092\u958b\u304f</button><button type=\"button\" data-act=\"select\">\u9078\u629e</button></div>",
        "</div>"
      ].join("");

      card.querySelector("[data-act='select']").addEventListener("click", function () { selectItem(item.id); });
      card.querySelector("[data-act='open-gpts']").addEventListener("click", function () {
        selectItem(item.id);
        copyAndOpenGpts();
      });
      card.querySelector("input").addEventListener("change", function (event) {
        setPosted(item, event.target.checked);
      });
      card.addEventListener("dblclick", function () { selectItem(item.id); });
      parent.appendChild(card);
    }

    function filteredItems() {
      return state.items.filter(function (item) {
        if (state.view === "posted" && !isPosted(item)) return false;
        if (state.hideUnreadable && itemUnreadable(item)) return false;
        if (state.tier !== "all" && postTier(item) !== state.tier) return false;
        if (!state.query) return true;
        return [item.title, item.titleJa, item.source, item.label, item.form, item.ticker].join(" ").toLowerCase().includes(state.query);
      });
    }

    function selectItem(id) {
      const item = findItem(id);
      if (!item) return;
      state.selectedId = id;
      el.detailHead.innerHTML = [
        "<h2>" + escapeHtml(displayTitle(item)) + "</h2>",
        item.titleJa ? "<div class=\"item-title-original\">" + escapeHtml(item.title) + "</div>" : "",
        "<div class=\"meta\">",
        renderTierBadge(item),
        "<span class=\"badge\">" + escapeHtml(item.label) + "</span>",
        (item.groupItems && item.groupItems.length > 1 ? "<span class=\"badge\">同ニュース×" + item.groupItems.length + "</span>" : ""),
        renderSignalBadges(item),
        item.form ? "<span class=\"badge\">" + escapeHtml(item.form) + "</span>" : "",
        "<span>" + escapeHtml(groupSources(item)) + "</span>",
        "<span>" + escapeHtml(formatTime(item.publishedAt)) + "</span>",
        "</div>",
        item.url ? "<div class=\"url-box\">" + escapeHtml(item.url) + "</div>" : "<div class=\"warn\">URLなし</div>"
      ].join("");
      el.gptsText.value = buildGptsText(item);
      el.copyStatus.textContent = "選択中";
      updateBlockSourceButton(item);
      renderFeed();
    }

    function displayTitle(item) {
      return item.titleJa || item.title || "";
    }

    function isUntranslated(item) {
      if (item.titleJa) return false;
      const text = String(item.title || "");
      return text && !/[ぁ-んァ-ヶ一-龠]/.test(text);
    }

    function buildGptsText(item) {
      const target = preferredReadableItem(item);
      return [
        target.url || "",
        "title: " + (target.title || item.title || ""),
        "source: " + (target.source || item.source || ""),
        "type: " + (item.label || item.type || ""),
        "補足: URLがBOT対策などで開けない場合は、タイトルと出典でWeb検索して本文を確認してから書くこと。"
      ].filter(Boolean).join("\n");
    }

    function weeklyPriorityItems() {
      const seenIds = new Set();
      const candidates = state.rawItems.filter(function (item) {
        if (!(item.title || item.url)) return false;
        if (isExcludedSource(item)) return false;
        if (item.id && seenIds.has(item.id)) return false;
        if (item.id) seenIds.add(item.id);
        if (!isWithinHours(item, 168)) return false;
        return postTier(item) === 0;
      }).map(function (item) {
        return Object.assign({}, item, { groupItems: undefined });
      });
      return groupSimilarItems(candidates).sort(compareNewsPriority).slice(0, 10);
    }

    function buildWeeklyDigestText(items) {
      const rows = [
        "mode: weekly_digest",
        "対象期間: 直近7日間",
        "依頼: 以下の🚨速報ニュースを重複整理し、重要度順に選んで、1つのX長文投稿として週間まとめを作成してください。",
        "形式: ニュースごとに、日本語の見出し、100〜200字程度の要約、出典名、実記事URLを並べてください。スレッドには分割しないでください。"
      ];
      items.forEach(function (item, index) {
        const target = preferredReadableItem(item);
        rows.push(
          "",
          "記事" + (index + 1),
          "title: " + (target.title || item.title || ""),
          item.titleJa ? "title_ja: " + item.titleJa : "",
          "source: " + (target.source || item.source || ""),
          "type: " + (item.label || item.type || ""),
          "published_at: " + (item.publishedAt || item.acceptedAt || ""),
          "priority_score: " + newsPriorityScore(item),
          "url: " + (target.url || item.url || "")
        );
      });
      return rows.filter(function (row) { return row !== ""; }).join("\n");
    }

    async function createWeeklyDigest() {
      const items = weeklyPriorityItems();
      if (!items.length) {
        el.copyStatus.innerHTML = "<span class=\"warn\">直近7日間に🚨速報ニュースがありません</span>";
        alert("直近7日間に🚨速報ニュースがありません。");
        return;
      }
      const text = buildWeeklyDigestText(items);
      el.gptsText.value = text;
      el.detailHead.innerHTML = [
        "<h2>🚨速報の週間まとめ</h2>",
        "<div class=\"muted\">直近7日・重複整理後 " + items.length + " 件をGPTsへ渡します。投稿済みの記事も振り返り対象に含みます。</div>"
      ].join("");
      const opened = window.open(WEEKLY_GPTS_URL, "_blank");
      if (opened) opened.opener = null;
      try {
        await copyText(text);
        el.copyStatus.innerHTML = opened
          ? "<span class=\"ok\">週間まとめ用テキストをコピーしてGPTsを開きました</span>"
          : "<span class=\"warn\">コピーしました。ポップアップが遮断されたため、GPTsを手動で開いてください</span>";
      } catch (error) {
        el.copyStatus.innerHTML = "<span class=\"warn\">GPTsは開きましたが、コピーに失敗しました</span>";
      }
    }

    function preferredReadableItem(item) {
      const members = item && item.groupItems ? item.groupItems : [item];
      return members.find(function (member) {
        return member && member.url && !isUnreadableSource(member.source);
      }) || members.find(function (member) {
        return member && member.url;
      }) || item;
    }

    async function copyGptsText() {
      const item = selectedItem();
      if (!item) return;
      await copyText(buildGptsText(item));
      el.copyStatus.innerHTML = "<span class=\"ok\">GPTs用テキストをコピーしました</span>";
    }

    async function copyAndOpenGpts() {
      const item = selectedItem();
      if (!item) return;
      // await後にwindow.openするとポップアップブロックされるブラウザがあるため、
      // ユーザー操作の同期処理中に先に開く。
      const opened = window.open(GPTS_URL, "_blank");
      if (opened) opened.opener = null;
      try {
        await copyText(buildGptsText(item));
        el.copyStatus.innerHTML = opened
          ? "<span class=\"ok\">GPTs用テキストをコピーしてChatGPTを開きました</span>"
          : "<span class=\"warn\">コピーしました。ポップアップが遮断されたため、GPTsを手動で開いてください</span>";
      } catch (error) {
        el.copyStatus.innerHTML = "<span class=\"warn\">GPTsは開きましたが、コピーに失敗しました</span>";
      }
    }
    async function copySelectedUrl() {
      const item = selectedItem();
      if (!item) return;
      await copyText(preferredReadableItem(item).url || "");
      el.copyStatus.innerHTML = "<span class=\"ok\">URLをコピーしました</span>";
    }

    function openSelectedUrl() {
      const item = selectedItem();
      if (!item || !item.url) return;
      window.open(preferredReadableItem(item).url, "_blank", "noopener,noreferrer");
    }

    function selectedItem() {
      const item = findItem(state.selectedId);
      if (!item) {
        el.copyStatus.innerHTML = "<span class=\"warn\">先にニュースを選択してください</span>";
        return null;
      }
      if (!item.url) {
        el.copyStatus.innerHTML = "<span class=\"warn\">このニュースにはURLがありません</span>";
        return null;
      }
      return item;
    }

    function findItem(id) {
      return state.items.find(function (item) { return item.id === id; });
    }

    // ============================================================
    // 投稿済み同期: サーバー(Blobs・IDごとの個別キー)を唯一の正とする。
    // pendingOps = まだサーバー反映が確定していないローカル操作。
    // 定期同期がサーバー状態で置き換える際も、pending分は上書きしない。
    // これで「操作した直後に同期が走って元に戻る」チラつきを防ぐ。
    // ============================================================
    async function loadPostedFromServer() {
      await flushPendingOps();
      try {
        const data = await fetchJson(postedEndpoint, 8000);
        if (data.ok && Array.isArray(data.blockedSources)) {
          state.blockedSources = new Set(data.blockedSources.map(normalizeSourceKey));
          state.allowedSources = new Set((data.allowedSources || []).map(normalizeSourceKey));
        }
        if (data.ok && Array.isArray(data.ids)) {
          replacePosted(data.ids);
        }
      } catch (error) {
        // サーバーに届かない時だけローカルの控えで表示を維持する
      }
    }

    // 送信に失敗して残っている操作を再送する(60秒ごとの同期時に呼ばれる)。
    // pendingOpsは「表示の保護」だけでなく「送信待ちキュー」を兼ねる。
    async function flushPendingOps() {
      if (!pendingOps.size) return;
      const add = [];
      const del = [];
      pendingOps.forEach(function (want, id) { (want ? add : del).push(id); });
      try {
        if (add.length) {
          const response = await fetch(postedEndpoint, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ ids: add, posted: true })
          });
          if (response.ok) add.forEach(function (id) { pendingOps.delete(id); });
        }
        if (del.length) {
          const response = await fetch(postedEndpoint, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ ids: del, posted: false })
          });
          if (response.ok) del.forEach(function (id) { pendingOps.delete(id); });
        }
      } catch (error) {
        // まだ届かない。次の同期で再挑戦する。
      }
    }

    function replacePosted(ids) {
      const next = new Set(ids.map(String));
      // 飛行中の操作はサーバーより新しい意思なので優先する
      pendingOps.forEach(function (want, id) {
        if (want) next.add(id);
        else next.delete(id);
      });
      state.posted = next;
      saveLocalPosted();
      refreshSimilarPostedFlags();
      updateViewButtons();
      renderFeed();
    }

    async function setPosted(item, posted) {
      // グループ全員 + rawItems内の類似記事(48h外や後着分)にも同じチェックを連動させる。
      const targets = (item.groupItems || [item]).slice();
      state.rawItems.forEach(function (other) {
        if (targets.indexOf(other) < 0 && other.id !== item.id && isSimilarNews(item, other)) targets.push(other);
      });
      // 新旧両方のIDを一緒に更新する。旧IDを消さないと、
      // 過去に旧IDで付けたチェックを外しても同期で復活してしまう。
      const idSet = new Set();
      targets.forEach(function (target) {
        [target.id, target.legacyId].forEach(function (id) { if (id) idSet.add(id); });
      });
      const ids = Array.from(idSet);
      // 先にローカルへ反映(体感を速く)し、確定まではpendingで保護
      ids.forEach(function (id) {
        pendingOps.set(id, posted);
        if (posted) state.posted.add(id);
        else state.posted.delete(id);
      });
      saveLocalPosted();
      refreshSimilarPostedFlags();
      updateViewButtons();
      renderFeed();
      try {
        const response = await fetch(postedEndpoint, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ ids: ids, posted: posted })
        });
        if (response.ok) ids.forEach(function (id) { pendingOps.delete(id); });
      } catch (error) {
        // 失敗時はpendingに残し、次の同期でも意思を優先し続ける
      }
    }

    // 表示中(検索・期間タブ適用後)の未チェック記事を一括で投稿済みにする。
    // 「ここまでは確認済み、以降の新着だけ見たい」用。
    async function markAllPosted() {
      const targets = filteredItems().filter(function (item) { return !isPosted(item); });
      if (!targets.length) {
        el.copyStatus.innerHTML = "<span class=\"warn\">表示中に未チェックの記事はありません</span>";
        return;
      }
      if (!confirm("表示中の未チェック " + targets.length + " 件をすべて投稿済みにします。よろしいですか？")) return;
      const idSet = new Set();
      targets.forEach(function (target) {
        (target.groupItems || [target]).forEach(function (member) {
          [member.id, member.legacyId].forEach(function (id) { if (id) idSet.add(id); });
        });
      });
      const ids = Array.from(idSet);
      ids.forEach(function (id) {
        pendingOps.set(id, true);
        state.posted.add(id);
      });
      saveLocalPosted();
      refreshSimilarPostedFlags();
      updateViewButtons();
      renderFeed();
      el.copyStatus.innerHTML = "<span class=\"ok\">" + targets.length + " 件を投稿済みにしました(同期中)</span>";
      // サーバー書き込みは1回のPOSTだと件数が多い時に関数タイムアウトの恐れが
      // あるため、40IDずつに分けて送る。失敗した分はpendingが守る。
      try {
        let allSynced = true;
        for (let i = 0; i < ids.length; i += 40) {
          const chunk = ids.slice(i, i + 40);
          const response = await fetch(postedEndpoint, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ ids: chunk, posted: true })
          });
          if (response.ok) chunk.forEach(function (id) { pendingOps.delete(id); });
          else allSynced = false;
        }
        el.copyStatus.innerHTML = allSynced
          ? "<span class=\"ok\">" + targets.length + " 件を投稿済みにしました</span>"
          : "<span class=\"warn\">一部の同期に失敗(60秒後の自動同期で再送されます)</span>";
      } catch (error) {
        el.copyStatus.innerHTML = "<span class=\"warn\">一部の同期に失敗(60秒後の自動同期で再送されます)</span>";
      }
    }

    async function clearPosted() {
      if (!confirm("投稿済みチェックを全端末で全消去します。よろしいですか？")) return;
      pendingOps.clear();
      state.posted.clear();
      saveLocalPosted();
      refreshSimilarPostedFlags();
      updateViewButtons();
      renderFeed();
      try {
        // サーバー側もクリアしないと次回同期で復活してしまう
        const response = await fetch(postedEndpoint, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ clear: true })
        });
        const data = await response.json();
        if (data.ok && Array.isArray(data.ids)) replacePosted(data.ids);
      } catch (error) {
        // Local state is enough if shared state is unavailable.
      }
    }

    async function fetchJson(url, timeoutMs) {
      const response = await fetchWithTimeout(url, { cache: "no-store" }, timeoutMs);
      const text = await response.text();
      if (!response.ok) throw new Error("HTTP " + response.status + ": " + text.slice(0, 120));
      try {
        return JSON.parse(text);
      } catch (error) {
        throw new Error("JSONではない応答: " + text.slice(0, 120));
      }
    }

    async function fetchWithTimeout(url, options, timeoutMs) {
      const controller = new AbortController();
      const timer = setTimeout(function () { controller.abort(); }, timeoutMs);
      try {
        return await fetch(url, Object.assign({}, options || {}, { signal: controller.signal }));
      } catch (error) {
        if (error.name === "AbortError") throw new Error("タイムアウト: " + url);
        throw error;
      } finally {
        clearTimeout(timer);
      }
    }

    async function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        return;
      }
      const area = document.createElement("textarea");
      area.value = text;
      document.body.appendChild(area);
      area.select();
      document.execCommand("copy");
      area.remove();
    }

    function loadLocalPosted() {
      try {
        const parsed = JSON.parse(localStorage.getItem("ionq-collector-posted") || "[]");
        return Array.isArray(parsed) ? parsed : [];
      } catch (error) {
        return [];
      }
    }

    function saveLocalPosted() {
      localStorage.setItem("ionq-collector-posted", JSON.stringify(Array.from(state.posted).slice(-1000)));
    }

    // ============================================================
    // 統一ID: watch-ionq.js / latest-ionq.js のstableIdと完全に同じロジック。
    // 片方を変えるときは必ず3ファイル同時に変えること。
    // typeをIDに含めない: 同じ記事が別カテゴリ(NEWS/QNEWS/IR/CNEWS)で
    // 取れても同一IDになり、投稿済みチェックがカテゴリをまたいで効く。
    // ============================================================
    function stableId(item) {
      const basis = item.form
        ? "F|" + String(item.url || item.title || "")
        : "N|" + normalizeSignatureV2(item.title);
      return "u" + fnvHash(basis);
    }

    // 旧ID(type込み)。サーバーに残っている過去の投稿済みチェックを
    // 引き継ぐためだけに残す。新規チェックは新IDで保存される。
    function legacyStableId(item) {
      const basis = item.form
        ? String(item.type || "") + "|" + String(item.url || item.title || "")
        : String(item.type || "") + "|" + normalizeSignature(item.title);
      return "n" + fnvHash(basis);
    }

    function fnvHash(basis) {
      let hash = 2166136261;
      for (let i = 0; i < basis.length; i += 1) {
        hash ^= basis.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      return (hash >>> 0).toString(16);
    }

    function isPosted(item) {
      if (isDirectlyPosted(item) || item.similarPosted) return true;
      return Boolean(item.groupItems) && item.groupItems.some(function (member) {
        return isDirectlyPosted(member) || member.similarPosted;
      });
    }

    function normalizeSignature(text) {
      return String(text || "")
        .toLowerCase()
        .replace(/https?:\/\/\S+/g, "")
        .replace(/\s+-\s+[^-|]+$/g, "")
        .replace(/[\s　]+/g, " ")
        .trim();
    }

    // 新IDの基礎になる正規化(V2)。"IonQ (IONQ) Launches..." と "IonQ Launches..." の
    // ようなティッカー括弧だけの差を吸収する。legacyStableIdは旧normalizeSignatureのまま
    // にすること(過去チェックの引き継ぎ用なので変えてはいけない)。
    function normalizeSignatureV2(text) {
      return String(text || "")
        .toLowerCase()
        .replace(/https?:\/\/\S+/g, "")
        .replace(/\s+-\s+[^-|]+$/g, "")
        .replace(/\((?:nyse|nasdaq|otcmkts|otc|asx)?[:\s]*[a-z]{1,6}\)/g, " ")
        .replace(/[\s　]+/g, " ")
        .trim();
    }

    // ============================================================
    // 類似記事の同一視: 同じニュースを別メディアが言い換えた記事は
    // 別IDになるため、次の条件が全部揃ったら同じニュースとみなす。
    //   1. 銘柄の組み合わせが同一(単語境界つき判定)
    //   2. アンカー(全大文字の固有名詞や数値)が両方にあるなら最低1つ共通
    //   3. 重み付きタイトル類似度 >= 0.22(珍しい単語の一致を重く数える)
    //      または 素の語彙一致率 >= 0.5
    // これで「Rigetti版とIonQ版の定型記事」「(WDAY)と(AGYS)の同型見出し」は
    // 混ざらず、言い換え転載(Qolab調達×4媒体など)は統合される。
    // watch-ionq.js にも同じロジックあり。変更時は両方同時に。
    // ============================================================
    const TITLE_STOPWORDS = new Set(["the", "a", "an", "of", "to", "in", "on", "for", "and", "or", "is", "are", "as", "at", "its", "with", "by", "from"]);
    const TICKER_PATTERNS = [
      ["ionq", /\bionq\b/],
      ["rgti", /\brigetti\b|\brgti\b/],
      ["qbts", /\bd-wave\b|\bdwave\b|\bqbts\b/],
      ["qubt", /\bqubt\b|\bquantum computing inc\b/],
      ["skyt", /\bskywater\b|\bskyt\b/],
      ["quantinuum", /\bquantinuum\b/],
      ["ibm", /\bibm\b/],
      ["googl", /\bgoogle\b|\balphabet\b/],
      ["msft", /\bmicrosoft\b/],
      ["amzn", /\bamazon\b|\baws\b/],
      ["nvda", /\bnvidia\b|\bnvda\b/],
      ["hon", /\bhoneywell\b/],
      ["archer", /\barcher\b/]
    ];

    function tickerKey(title) {
      const text = normalizeSignatureV2(title);
      return TICKER_PATTERNS.filter(function (p) { return p[1].test(text); }).map(function (p) { return p[0]; }).join(",");
    }

    function titleTokens(title) {
      const text = normalizeSignatureV2(title)
        .replace(/\$\s*(\d[\d,.]*)\s*(million|billion|m\b|b\b)?/g, function (s, n, u) { return " " + n.replace(/,/g, "") + (u ? u[0] : "") + " "; })
        .replace(/(\d[\d,.]*)\s*(million|billion)/g, function (s, n, u) { return " " + n.replace(/,/g, "") + u[0] + " "; })
        .replace(/[^a-z0-9\s%.]/g, " ");
      const set = new Set();
      text.split(/\s+/).forEach(function (word) {
        if (word && word.length > 1 && !TITLE_STOPWORDS.has(word)) set.add(word);
      });
      return set;
    }

    // アンカー = 全大文字の固有名詞(NSF, QBTS, ERASE, WDAY等)と数値(54.2m, 9.2%等)。
    // 「見出しの型は同じで対象が違う」記事を弾くための決め手になる。
    function anchorTokens(title, tokens) {
      const set = new Set();
      String(title || "").replace(/\s+-\s+[^-|]+$/, "").split(/[^A-Za-z0-9$%.,-]+/).forEach(function (word) {
        const w = word.replace(/[.,]+$/, "");
        if (/[A-Z]{2}/.test(w) && /^[A-Z0-9$%.-]+$/.test(w) && w.length > 1) set.add(w.toLowerCase());
      });
      tokens.forEach(function (word) { if (/\d/.test(word)) set.add(word); });
      return set;
    }

    // rawItems更新のたびに再構築する類似度インデックス
    // (df = 各単語が何記事に出るか。珍しい単語ほど一致の重みが大きい)
    const simIndex = { df: new Map(), toks: new Map(), anchors: new Map() };

    function rebuildSimilarityIndex() {
      simIndex.df = new Map();
      simIndex.toks = new Map();
      simIndex.anchors = new Map();
      state.rawItems.forEach(function (item) {
        if (item.form) return;
        const T = titleTokens(item.title);
        simIndex.toks.set(item, T);
        simIndex.anchors.set(item, anchorTokens(item.title, T));
        T.forEach(function (word) { simIndex.df.set(word, (simIndex.df.get(word) || 0) + 1); });
      });
    }

    function tokenWeight(word) {
      return 1 / Math.max(1, simIndex.df.get(word) || 1);
    }

    function itemTokens(item) {
      let T = simIndex.toks.get(item);
      if (!T) { T = titleTokens(item.title); simIndex.toks.set(item, T); }
      return T;
    }

    function itemAnchors(item) {
      let A = simIndex.anchors.get(item);
      if (!A) { A = anchorTokens(item.title, itemTokens(item)); simIndex.anchors.set(item, A); }
      return A;
    }

    function isSimilarNews(a, b) {
      if (a.form || b.form) return false;
      if (tickerKey(a.title) !== tickerKey(b.title)) return false;
      const anchorsA = itemAnchors(a);
      const anchorsB = itemAnchors(b);
      if (anchorsA.size && anchorsB.size) {
        let shared = false;
        anchorsA.forEach(function (word) { if (anchorsB.has(word)) shared = true; });
        if (!shared) return false;
      }
      const A = itemTokens(a);
      const B = itemTokens(b);
      if (A.size < 3 || B.size < 3) return false;
      let inter = 0;
      let wInter = 0;
      let wUnion = 0;
      A.forEach(function (word) {
        const g = tokenWeight(word);
        wUnion += g;
        if (B.has(word)) { inter += 1; wInter += g; }
      });
      B.forEach(function (word) { if (!A.has(word)) wUnion += tokenWeight(word); });
      const jac = inter / (A.size + B.size - inter);
      const wjac = wUnion ? wInter / wUnion : 0;
      return wjac >= 0.22 || jac >= 0.5;
    }

    // ============================================================
    // GPT(ChatGPT-User)がBOT対策で読めない可能性が高い媒体。
    // 2026-07-03 実測: robots.txt拒否 or 403/401/429/接続拒否だったもの+定番ペイウォール。
    // ユーザーは詳細パネルの「この媒体は読めなかった」で追加、「解除」で
    // このリストより優先される許可指定ができる(サーバー同期)。
    // ============================================================
    const UNREADABLE_SOURCE_PATTERNS = [
      /seeking alpha/i,
      /barron/i,
      /nasdaq/i,
      /hpcwire/i,
      /data center dynamics/i,
      /yahoo/i,
      /\bmsn\b/i,
      /moomoo/i,
      /wall street journal|\bwsj\b/i,
      /bloomberg/i,
      /reuters/i,
      /investor'?s business daily/i
    ];

    function normalizeSourceKey(name) {
      return String(name || "").toLowerCase().replace(/[\s　]+/g, " ").trim();
    }

    // 収集品質フィルタ。watch-ionq.jsにも同じロジックあり(変更時は両方)。
    // スパム媒体 + ジャンクタイトル + 文脈なし短タイトルを除外する。
    const EXCLUDED_SOURCE_PATTERNS = [
      /\bmshale\b/i,
      /\bad hoc news\b/i,
      /\bpluang\b/i,
      /stock traders daily/i,
      /chartmill/i,
      /marketbeat/i
    ];
    const JUNK_TITLE_PATTERNS = [
      /\([A-Za-z0-9]{8,12}\)\s*(-|$)/,
      /stock forum and discussion/i,
      /stock quote price|price and forecast\b/i,
      /depositary receipts/i
    ];

    function isExcludedSource(item) {
      const text = (item.source || "") + " " + (item.title || "");
      if (EXCLUDED_SOURCE_PATTERNS.some(function (re) { return re.test(text); })) return true;
      if (JUNK_TITLE_PATTERNS.some(function (re) { return re.test(item.title || ""); })) return true;
      if (!item.form && String(item.title || "").trim().split(/\s+/).length <= 2) return true;
      return false;
    }

    function isUnreadableSource(name) {
      const key = normalizeSourceKey(name);
      if (!key) return false;
      if (state.allowedSources.has(key)) return false;
      if (state.blockedSources.has(key)) return true;
      return UNREADABLE_SOURCE_PATTERNS.some(function (re) { return re.test(key); });
    }

    // グループ内に読める媒体が1つでもあれば「読める」扱い
    // (同じ記事を読めるURLがあるなら省く理由がないため)。
    function itemUnreadable(item) {
      if (item.form) return false; // SEC本文はEDGARで読める
      return (item.groupItems || [item]).every(function (member) {
        return isUnreadableSource(member.source);
      });
    }

    async function toggleBlockedSource() {
      const item = findItem(state.selectedId);
      if (!item || !item.source) return;
      const key = normalizeSourceKey(item.source);
      const wasUnreadable = isUnreadableSource(item.source);
      if (wasUnreadable) {
        state.allowedSources.add(key);
        state.blockedSources.delete(key);
      } else {
        state.blockedSources.add(key);
        state.allowedSources.delete(key);
      }
      updateBlockSourceButton(item);
      renderFeed();
      el.copyStatus.innerHTML = wasUnreadable
        ? "<span class=\"ok\">「" + escapeHtml(item.source) + "」を読める扱いに戻しました</span>"
        : "<span class=\"ok\">「" + escapeHtml(item.source) + "」を読めない媒体として記録しました</span>";
      try {
        await fetch(postedEndpoint, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(wasUnreadable ? { unblockSource: item.source } : { blockSource: item.source })
        });
      } catch (error) {
        // 失敗してもローカル表示は維持。次回開いた時にサーバー状態へ戻る。
      }
    }

    function updateBlockSourceButton(item) {
      if (!item || !item.source) {
        el.blockSource.textContent = "この媒体は読めなかった";
        return;
      }
      el.blockSource.textContent = isUnreadableSource(item.source)
        ? "「" + item.source + "」を読める扱いに戻す"
        : "「" + item.source + "」は読めなかった";
    }

    function isDirectlyPosted(item) {
      return state.posted.has(item.id) || (item.legacyId && state.posted.has(item.legacyId));
    }

    // 投稿済みチェックの状態が変わるたびに呼び、
    // 「投稿済みの記事と類似する未チェック記事」へフラグを伝播する。
    // 後から届いた言い換え記事も、既存チェックを引き継いで投稿済み表示になる。
    function refreshSimilarPostedFlags() {
      const postedNews = state.rawItems.filter(function (item) { return !item.form && isDirectlyPosted(item); });
      state.rawItems.forEach(function (item) {
        item.similarPosted = false;
        if (item.form || isDirectlyPosted(item)) return;
        item.similarPosted = postedNews.some(function (posted) { return isSimilarNews(item, posted); });
      });
    }

    function isFreshItem(item) {
      return isWithinHours(item, state.maxAgeHours);
    }

    function isWithinHours(item, hours) {
      const value = item.publishedAt || item.acceptedAt || item.filingDate || item.reportDate || "";
      const ms = Date.parse(value);
      if (!Number.isFinite(ms)) return false;
      const age = Date.now() - ms;
      return age >= -5 * 60 * 1000 &&
        age <= hours * 60 * 60 * 1000;
    }

    function signalText(item) {
      return [
        item.title,
        item.source,
        item.label,
        item.form,
        item.description,
        item.companyName,
        item.ticker
      ].join(" ").toLowerCase();
    }

    const HIGH_IMPACT_NEWS_RE = /earnings|revenue|guidance|quarterly results?|annual results?|contract|award|order|bookings?|backlog|multi[ -]year|definitive agreement|\$\s?\d[\d,.]*\s?(?:million|billion)|\d[\d,.]*\s?(?:million|billion) dollars|funding|financing|raises?|raised|offering|convertible|acquisition|merger|buyout|dilution|upgrade|downgrade|price target|rating|breakthrough|logical qubit|error correction|fault[ -]tolerant|quantum advantage|legislation|appropriation|government budget|executive order|national strategy|export controls?|debt ceiling|government shutdown|short seller/i;
    const MATERIAL_NEWS_RE = /deal|partnership|strategic|collaboration|customer|deployment|government|defense|army|navy|air force|darpa|doe|nasa|commercial|production|data center|investment|stake|analyst/i;
    const CRITICAL_MACRO_RE = /emergency rate cut|emergency rate hike|market crash|market selloff|bank (?:crisis|failure|collapse)|liquidity crisis|debt default|government shutdown begins|trading halt|vix (?:spikes?|surges?)/i;
    const MARKET_MOVING_MACRO_RE = /(?:federal reserve|\bfed\b|\bfomc\b).*(?:cuts?|hikes?|holds?|decision|statement)|(?:rate cut|rate hike|interest rate decision)|consumer price index summary|producer price index summary|employment situation|jobs report|nonfarm payrolls?|gross domestic product|personal income and outlays|\bcpi\b.*(?:rises?|falls?|increases?|decreases?|\d)|\bpce\b.*(?:rises?|falls?|increases?|decreases?|\d)|\bgdp\b.*(?:growth|grows?|contracts?|beats?|misses?|\d)|unemployment.*(?:rises?|falls?|\d)|jobless claims.*(?:jumps?|rises?|falls?|drops?|\d)|treasury auction.*(?:weak|strong|yield|demand)|yields?.*(?:surges?|jumps?|spikes?)/i;
    const LOW_VALUE_NEWS_RE = /should you buy|is .* a buy|stock price prediction|price forecast|where will .* stock|why .* stock|could .* stock|millionaire.?maker|technical analysis|unusual options|options trading|short interest|wall street thinks|top \d+ .*stocks?/i;
    const RECAP_NEWS_RE = /weekly (?:roundup|recap)|news roundup|year in review|look(?:ing)? back|revisited|what we (?:know|learned)|previously announced|earlier this (?:week|month|year)|last quarter|history of/i;
    const PREVIEW_NEWS_RE = /what to expect|earnings preview|ahead of (?:earnings|results)|set to report|scheduled to (?:report|announce)|will report|earnings date|could announce|expected to announce/i;
    const PRIMARY_SOURCE_RE = /sec edgar|ionq ir|ionq公式|nasdaq\/ionq|business wire|globenewswire|pr newswire|\.gov\b|darpa|department of defense|department of energy|federal reserve|\bbls\b|bureau of labor statistics|\bbea\b|bureau of economic analysis/i;

    function heuristicPriorityScore(item) {
      const text = signalText(item);
      const category = String(item.category || "").toLowerCase();
      const ionqText = [item.title, item.description, item.companyName, item.ticker, item.source, item.url].join(" ").toLowerCase();
      const directIonq = String(item.ticker || "").toUpperCase() === "IONQ" || /\bionq\b|\$ionq|ionq公式|ionq ir|nasdaq\/ionq/.test(ionqText);
      const sourceText = [item.source, item.label, item.url].join(" ").toLowerCase();
      const form = String(item.form || "").toUpperCase();
      const importantForm = /^(8-K|10-Q|10-K|S-3|424B|13D|13G|SC 13|DEF 14A)/.test(form);
      const highImpact = HIGH_IMPACT_NEWS_RE.test(text) || importantForm;
      const material = highImpact || MATERIAL_NEWS_RE.test(text);
      const primary = PRIMARY_SOURCE_RE.test(sourceText) || Boolean(item.form);
      let score = 0;
      if (directIonq) score += 30;
      if (highImpact) score += 40;
      else if (material) score += 30;
      if (primary) score += 15;
      if ((category === "competitor" || category === "quantum") && material) score += 20;
      if (category === "macro" && MARKET_MOVING_MACRO_RE.test(text)) score += 65;
      if (category === "macro" && CRITICAL_MACRO_RE.test(text)) score = Math.max(score, 85);
      if (LOW_VALUE_NEWS_RE.test(text)) score = Math.min(score - 45, 39);
      if (RECAP_NEWS_RE.test(text)) score = Math.min(score, 49);
      if (PREVIEW_NEWS_RE.test(text)) score = Math.min(score, 59);
      return Math.max(0, Math.min(100, score));
    }

    function mergeAiPriorityScore(baseScore, aiScore) {
      const base = Number(baseScore);
      const ai = Number(aiScore);
      if (!Number.isFinite(ai) || ai < 0 || ai > 100) return base;
      return Math.max(0, Math.min(100, Math.round(base * 0.35 + ai * 0.65)));
    }

    function newsPriorityScore(item, nowValue) {
      return mergeAiPriorityScore(heuristicPriorityScore(item), item.aiPriorityScore);
    }

    function compareNewsPriority(a, b) {
      const scoreDiff = newsPriorityScore(b) - newsPriorityScore(a);
      if (scoreDiff) return scoreDiff;
      return Date.parse(b.publishedAt || b.acceptedAt || 0) - Date.parse(a.publishedAt || a.acceptedAt || 0);
    }

    function priorityReasons(item) {
      const text = signalText(item);
      const ionqText = [item.title, item.description, item.companyName, item.ticker, item.source, item.url].join(" ").toLowerCase();
      const sourceText = [item.source, item.label, item.url].join(" ").toLowerCase();
      const reasons = [];
      if (String(item.ticker || "").toUpperCase() === "IONQ" || /\bionq\b|\$ionq|ionq公式|ionq ir|nasdaq\/ionq/.test(ionqText)) reasons.push("IonQ直結");
      if (PRIMARY_SOURCE_RE.test(sourceText) || item.form) reasons.push("一次情報");
      const form = String(item.form || "").toUpperCase();
      if (HIGH_IMPACT_NEWS_RE.test(text) || /^(8-K|10-Q|10-K|S-3|424B|13D|13G|SC 13|DEF 14A)/.test(form)) reasons.push("重要材料");
      else if (MATERIAL_NEWS_RE.test(text)) reasons.push("関連材料");
      if (item.category === "macro") reasons.push("市場全体");
      if (RECAP_NEWS_RE.test(text)) reasons.push("既報・振り返り");
      if (Number.isFinite(Number(item.aiPriorityScore))) reasons.push("AI確認済み");
      return Array.from(new Set(reasons)).slice(0, 3);
    }

    function renderPriorityReasonBadges(item) {
      return priorityReasons(item).slice(0, 1).map(function (reason) {
        return "<span class=\"badge signal\">" + escapeHtml(reason) + "</span>";
      }).join("");
    }

    function marketSessionLabel(value) {
      const ms = Date.parse(value || "");
      if (!Number.isFinite(ms)) return "米時間不明";
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: "America/New_York",
        weekday: "short",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23"
      }).formatToParts(new Date(ms));
      const values = {};
      parts.forEach(function (part) { values[part.type] = part.value; });
      if (values.weekday === "Sat" || values.weekday === "Sun") return "米休場";
      const minutes = Number(values.hour) * 60 + Number(values.minute);
      if (minutes >= 4 * 60 && minutes < 9 * 60 + 30) return "米プレ";
      if (minutes >= 9 * 60 + 30 && minutes < 16 * 60) return "米市場中";
      if (minutes >= 16 * 60 && minutes < 20 * 60) return "米アフター";
      return "米休場";
    }

    function getSignalBadges(item) {
      const text = signalText(item);
      const badges = [];
      const form = String(item.form || "").toUpperCase();

      if (isMarketMovingCandidate(item)) badges.push("株価材料");
      if (/breakthrough|logical qubit|error correction|fault tolerant|quantum advantage|qubit|qpu|fidelity|gate|ion trap|trapped ion|superconducting|photonic|laser|amplifier|cryogenic|modular|algorithm/.test(text)) badges.push("技術材料");
      if (/contract|award|deal|order|booking|bookings|backlog|partnership|strategic|collaboration|customer|deployment|government|defense|commercial|production|data center/.test(text)) badges.push("事業材料");
      if (/funding|raises|raised|financing|offering|convertible|cash|debt|equity|acquisition|merger|investment|institutional investor|hedge fund|asset manager|etf|holdings|stake|portfolio/.test(text)) badges.push("資金材料");
      if (item.category === "macro") badges.push("金融・マクロ");
      if (/^(8-K|10-Q|10-K|S-3|424B|13D|13G|SC 13|DEF 14A)/.test(form) || item.category === "sec" || item.category === "competitor") badges.push("SEC/開示");
      if (!badges.length && item.category === "quantum") badges.push("業界材料");
      if (!badges.length && item.category === "news") badges.push("ニュース");

      return Array.from(new Set(badges)).slice(0, 3);
    }

    function renderSignalBadges(item) {
      return getSignalBadges(item).map(function (label) {
        return "<span class=\"badge signal\">" + escapeHtml(label) + "</span>";
      }).join("");
    }

    function isMarketMovingCandidate(item) {
      const text = signalText(item);

      if (!text.trim()) return false;

      const form = String(item.form || "").toUpperCase();
      if (/^(8-K|10-Q|10-K|S-3|424B|13D|13G|SC 13|DEF 14A)/.test(form)) return true;

      const strongKeywords = [
        "earnings", "revenue", "guidance", "results", "quarterly", "annual",
        "contract", "award", "deal", "order", "booking", "bookings", "backlog",
        "partnership", "strategic", "collaboration", "customer", "deployment",
        "government", "defense", "army", "navy", "air force", "darpa", "doe", "nasa",
        "funding", "raises", "raised", "financing", "offering", "convertible",
        "acquisition", "merger", "buyout", "investment",
        "analyst", "upgrade", "downgrade", "price target", "rating", "institutional investor", "hedge fund", "asset manager", "etf", "holdings", "stake", "portfolio",
        "breakthrough", "logical qubit", "error correction", "fault tolerant",
        "quantum advantage", "commercial", "production", "data center"
      ];

      const quantumTickers = [
        "$ionq", "ionq", "$rgti", "rigetti", "$qbts", "d-wave", "$qubt",
        "quantinuum", "ibm quantum", "google quantum", "microsoft quantum",
        "aws braket", "nvidia quantum"
      ];

      const hasStrong = strongKeywords.some(function (word) { return text.includes(word); });
      const hasTicker = quantumTickers.some(function (word) { return text.includes(word); });

      if (hasStrong && hasTicker) return true;
      if (item.category === "ir" || item.category === "sec" || item.category === "competitor") return hasStrong || hasTicker;
      return hasStrong && /quantum|qubit|qpu|ion trap|trapped ion|superconducting|photonic/.test(text);
    }

    function formatTime(value) {
      if (!value) return "";
      const ms = Date.parse(value);
      if (!Number.isFinite(ms)) return String(value).slice(0, 16);
      return new Intl.DateTimeFormat("ja-JP", {
        timeZone: "Asia/Tokyo",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }).format(new Date(ms));
    }

    function errorBox(title, message, url) {
      return [
        "<div class=\"empty\">",
        "<div class=\"warn\">" + escapeHtml(title) + "</div>",
        "<div>" + escapeHtml(message || "") + "</div>",
        "<div class=\"muted\">" + escapeHtml(url || "") + "</div>",
        "</div>"
      ].join("");
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }
  </script>
</body>
</html>
