[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# 通知チェックは30分おき（月間約1,440回）。
# 5分おきと比べて実行回数とFunctions Computeを約6分の1に抑える。
[functions."watch-ionq"]
  schedule = "*/30 * * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store"
