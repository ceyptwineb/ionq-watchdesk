[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# 通知チェックは1時間おき（月間約720回）。
# 30分おきから半減し、重要速報と朝夜まとめの鮮度は維持する。
[functions."watch-ionq"]
  schedule = "0 * * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store"
